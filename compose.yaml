name: tribulens

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tribulens
      POSTGRES_USER: tribulens
      POSTGRES_PASSWORD: tribulens-local
    ports:
      - "5435:5432"
    volumes:
      - tribulens-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tribulens-postgres-data: