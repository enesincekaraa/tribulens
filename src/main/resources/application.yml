spring:
  application:
    name: tribulens

  datasource:
    url: ${TRIBULENS_DB_URL:jdbc:postgresql://localhost:5435/tribulens}
    username: ${TRIBULENS_DB_USER:tribulens}
    password: ${TRIBULENS_DB_PASSWORD:tribulens-local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info